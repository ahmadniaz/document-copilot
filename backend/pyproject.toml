[project]
name = "document-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.159.1",
    "httpx==0.28.1",
    "openai==3.36.0",
    "pgvector==0.5.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-ai==2.59.0",
    "pydantic-settings==2.16.1",
    "sqlalchemy==2.1.6",
    "structlog==26.1.0",
    "supabase==2.33.0",
    "uvicorn==0.54.0",
]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "ipykernel==7.4.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
]
